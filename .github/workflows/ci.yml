name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }}, node ${{ matrix.node-version }}, vitest ${{ matrix.vitest }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
        vitest: [4]
        exclude:
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22
        include:
          - os: windows-latest
            experimental: true
          - os: ubuntu-latest
            node-version: 24
            vitest: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Switch to vitest ${{ matrix.vitest }} (lockfile untouched)
        if: matrix.vitest != 4
        run: npm install --no-save "vitest@^${{ matrix.vitest }}.0.0"
      - run: node -p "'vitest ' + require('vitest/package.json').version"
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        if: runner.os == 'Linux'
      - run: npm run test:platform
        if: runner.os != 'Linux'

  os-full-suite:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node-version: [24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
